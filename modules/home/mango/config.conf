# Minimal MangoWM config based on your actual HyDE usage.
# Validate with: mango -c ~/.config/mango/config.conf -p

# Startup
# Set a wallpaper later, for example:
# exec-once=swaybg -i ~/Pictures/wallpaper.jpg -m fill

# Keep tags simple at first.
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:tile

# App launchers
bind=SUPER,a,spawn,rofi -show drun
bind=SUPER,t,spawn,ghostty
bind=SUPER+SHIFT,t,spawn,kitty

# Window/session basics
bind=SUPER,q,killclient
bind=SUPER,m,quit
bind=SUPER,f,togglefullscreen
bind=SUPER,w,togglefloating
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,e,spawn,wlogout

# Tags
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0

# Focus movement
bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down

# Media keys
bind=NONE,F11,spawn,pamixer -i 5
bind=NONE,F10,spawn,pamixer -d 5
bind=NONE,F9,spawn,pamixer -t
bind=NONE,F8,spawn,pamixer --default-source -t

# Tiling layout
gappih=6
gappiv=6
gappoh=2
gappov=2
smartgaps=1

# Scroller layout
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0

bind=SUPER,v,spawn,~/.config/mango/scripts/cliphist-rofi.sh
bind=SUPER+SHIFT,v,spawn,~/.config/mango/scripts/cliphist-clear.sh

bind=SUPER+SHIFT,p,spawn,~/.config/mango/scripts/screenshot-satty.sh
bind=SUPER,L,spawn,/run/current-system/sw/bin/swaylock -f
# Session services managed by Home Manager.
exec-once=mango-session-init
